name: Deploy to Vercel

# Runs on GitHub's infrastructure (full internet access), so it can reach
# Vercel and Supabase even though the web sandbox cannot.
#
# Required secret:
#   VERCEL_TOKEN          - https://vercel.com/account/tokens
# Optional secret (auto-applies the DB schema when present):
#   SUPABASE_DB_URL       - Postgres connection string from
#                           Supabase -> Project Settings -> Database -> Connection string (URI)
#
# The Supabase URL + anon key are public by design (protected by Row Level
# Security), so they are committed here rather than stored as secrets.

on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: "Vercel token (used if the VERCEL_TOKEN secret is not set). Revoke it after the run."
        required: false
        default: ""
  push:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: https://fayhlwuzplnyxtuqbxbm.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZheWhsd3V6cGxueXh0dXFieGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzM4OTksImV4cCI6MjA5NjE0OTg5OX0.t19-LnoYiNjv1kkgaKsNKV_TTM9OZB073czYEv2VKu0

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || github.event.inputs.vercel_token }}
    steps:
      - name: Mask the Vercel token in logs
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "::add-mask::$VERCEL_TOKEN"; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Supabase schema (if SUPABASE_DB_URL secret is set)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL not set - skipping schema apply."
            echo "Run supabase/schema.sql manually in the Supabase SQL Editor."
            exit 0
          fi
          echo "Applying supabase/schema.sql ..."
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          echo "Schema applied."

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create / link Vercel project
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::No Vercel token. Add a VERCEL_TOKEN repo secret, or pass vercel_token when dispatching."
            exit 1
          fi
          vercel project add my-prime-tracker --token "$VERCEL_TOKEN" 2>/dev/null || true
          vercel link --yes --project my-prime-tracker --token "$VERCEL_TOKEN"

      - name: Set environment variables on Vercel
        run: |
          for target in production preview development; do
            vercel env rm NEXT_PUBLIC_SUPABASE_URL "$target" -y --token "$VERCEL_TOKEN" 2>/dev/null || true
            printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | vercel env add NEXT_PUBLIC_SUPABASE_URL "$target" --token "$VERCEL_TOKEN"
            vercel env rm NEXT_PUBLIC_SUPABASE_ANON_KEY "$target" -y --token "$VERCEL_TOKEN" 2>/dev/null || true
            printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | vercel env add NEXT_PUBLIC_SUPABASE_ANON_KEY "$target" --token "$VERCEL_TOKEN"
          done

      - name: Build and deploy (production)
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"
          echo "## ✅ Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Production URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to: $url"
